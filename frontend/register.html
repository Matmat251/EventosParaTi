<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrarse</title>
    <link rel="stylesheet" href="css/stylesRegister.css">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="register-card">
        <h3>Crear Cuenta</h3>

        <form id="registerForm" method="POST" role="form">
            <!-- Nombre de Usuario -->
            <div class="mb-3">
                <label for="nombre" class="form-label">Nombre de Usuario</label>
                <input type="text" id="nombre" class="form-control" name="nombre" required>
            </div>
            <!-- Género -->
            <div class="mb-3">
                <label for="genero" class="form-label genero">Género</label>
                <select class="form-select" id="genero" name="genero" required>
                    <option value="" disabled selected>Seleccione una opción</option>
                    <option value="Masculino">Masculino</option>
                    <option value="Femenino">Femenino</option>
                    <option value="Otro">Otro</option>
                </select>
            </div>
            <!-- Correo Electrónico -->
            <div class="mb-3">
                <label for="email" class="form-label">Correo Electrónico</label>
                <input type="email" id="email" class="form-control" name="email" required>
                <small id="emailHelp" class="text-danger d-none"></small>
            </div>
            <!-- Contraseña -->
            <div class="mb-3">
                <label for="password" class="form-label">Contraseña</label>
                <input type="password" id="password" class="form-control" name="password" required>
                <small id="passwordHelp" class="text-danger d-none"></small>
            </div>
            <!-- Repetir contraseña -->
            <div class="mb-3">
                <label for="repeatPassword" class="form-label">Repetir contraseña</label>
                <input type="password" id="repeatPassword" class="form-control" name="repeatPassword" required>
                <small id="repeatHelp" class="text-danger d-none"></small>
            </div>

            <p id="errorMessage" class="text-danger text-center" style="display:none;">
                Las contraseñas no coinciden
            </p>

            <button type="submit" class="btn btn-primary">Registrarse</button>
        </form>

        <p class="text-center mt-3">
            ¿Ya tienes una cuenta?
            <a href="login.html">Iniciar sesión</a>
        </p>
    </div>    
    
    <script src="js/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/custom.js"></script>   

</body>
</html>
