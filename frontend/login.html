<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
   
    <link rel="stylesheet" href="css/styleLogin.css">
    
</head>
<body>
    
    <a href="index.html" class="back-button" title="Volver a la página principal">
        <i class="bi bi-arrow-left-circle-fill"></i> Volver
    </a>

    <div class="login-card">
        <h3 class="text-center">Iniciar Sesión</h3>

        <div id="alertaRegistro" aria-live="polite"></div>

        <form action="" id="loginForm">
            <div class="mb-3">
                <label for="email" class="form-label">Correo electronico</label>
                <input type="email" class="form-control" id="email" placeholder="email" name="email" required>
            </div>

            <div class="mb-3">
                <label for="password" class="form-label">Contraseña</label>
                <input type="password" class="form-control" id="password" placeholder="contraseña" name="password" required>
            </div>

            <div class="d-flex justify-content-between mb-3">
                <div>
                    <input type="checkbox" id="recordarme" title="Recordarme">
                    <label for="recordarme">Recordarme</label>
                </div>
                <a href="#" class="text-primary">¿Olvidaste tu contraseña?</a>
            </div>
            
            <button type="submit" class="btn btn-primary">Ingresar</button>
        </form>

        <p class="text-center mt-3 form-text">
            ¿No tienes una cuenta?
            <a href="register.html" id="btnRegister">Registrate aquí</a>
        </p>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {

            const params = new URLSearchParams(window.location.search);
            
            if (params.get('registro') === 'ok') {

                const alertDiv = document.getElementById('alertaRegistro');
                alertDiv.innerHTML = `
                    <div class="alert alert-success text-center">Registro exitoso ✔. Por favor, inicia sesión.</div>
                `;

                // Ocultar el mensaje despues de 5 segundos
                setTimeout(() => {
                    alertDiv.remove();
                }, 5000);
            }
        });
    </script>
    <script src="js/jquery.min.js"></script>
    <script src="js/custom.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body> 
</html>
