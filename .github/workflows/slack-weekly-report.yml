# ================================================================
#  WORKFLOW: Reporte Semanal Automatizado a Slack
#  Canal destino: #general
# ================================================================
name: Reporte Semanal - Slack

on:
  schedule:
    # Todos los lunes a las 14:00 UTC (9:00 AM Peru)
    - cron: '0 14 * * 1'
  workflow_dispatch:

jobs:
  weekly-report:
    name: "Generar Reporte Semanal"
    runs-on: ubuntu-latest

    steps:
      - name: "Checkout del codigo"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "Recopilar metricas del repositorio"
        id: metrics
        run: |
          echo "=============================================="
          echo "  Recopilando metricas del repositorio"
          echo "=============================================="

          COMMITS_WEEK=$(git log --oneline --since="7 days ago" | wc -l)
          echo "commits_week=$COMMITS_WEEK" >> $GITHUB_OUTPUT

          PHP_FILES=$(find backend/ -name "*.php" | wc -l)
          echo "php_files=$PHP_FILES" >> $GITHUB_OUTPUT

          HTML_FILES=$(find frontend/ -name "*.html" | wc -l)
          echo "html_files=$HTML_FILES" >> $GITHUB_OUTPUT

          JS_FILES=$(find frontend/ -name "*.js" ! -name "*.min.js" | wc -l)
          echo "js_files=$JS_FILES" >> $GITHUB_OUTPUT

          PHP_LINES=$(find backend/ -name "*.php" -exec cat {} \; | wc -l)
          echo "php_lines=$PHP_LINES" >> $GITHUB_OUTPUT

          CONTRIBUTORS=$(git log --since="7 days ago" --format='%an' | sort -u | wc -l)
          echo "contributors=$CONTRIBUTORS" >> $GITHUB_OUTPUT

          LAST_COMMIT=$(git log -1 --format='%s')
          echo "last_commit=$LAST_COMMIT" >> $GITHUB_OUTPUT

          BRANCHES=$(git branch -r | grep -v HEAD | wc -l)
          echo "branches=$BRANCHES" >> $GITHUB_OUTPUT

          echo "[OK] Metricas recopiladas exitosamente"

      - name: "Enviar Reporte Semanal a Slack"
        if: env.SLACK_WEBHOOK_GENERAL != ''
        uses: slackapi/slack-github-action@v2.0.0
        with:
          webhook: ${{ env.SLACK_WEBHOOK_GENERAL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "blocks": [
                {
                  "type": "header",
                  "text": {
                    "type": "plain_text",
                    "text": "Reporte Semanal - EventosParaTi",
                    "emoji": false
                  }
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "Resumen automatizado del estado del repositorio para la semana actual."
                  }
                },
                {
                  "type": "divider"
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Actividad de la Semana:*"
                  }
                },
                {
                  "type": "section",
                  "fields": [
                    { "type": "mrkdwn", "text": "*Commits esta semana:*\n${{ steps.metrics.outputs.commits_week }}" },
                    { "type": "mrkdwn", "text": "*Contribuidores activos:*\n${{ steps.metrics.outputs.contributors }}" },
                    { "type": "mrkdwn", "text": "*Ramas activas:*\n${{ steps.metrics.outputs.branches }}" },
                    { "type": "mrkdwn", "text": "*Ultimo commit:*\n${{ steps.metrics.outputs.last_commit }}" }
                  ]
                },
                {
                  "type": "divider"
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Metricas del Codigo:*"
                  }
                },
                {
                  "type": "section",
                  "fields": [
                    { "type": "mrkdwn", "text": "*Archivos PHP:*\n${{ steps.metrics.outputs.php_files }}" },
                    { "type": "mrkdwn", "text": "*Lineas PHP:*\n${{ steps.metrics.outputs.php_lines }}" },
                    { "type": "mrkdwn", "text": "*Archivos HTML:*\n${{ steps.metrics.outputs.html_files }}" },
                    { "type": "mrkdwn", "text": "*Archivos JS:*\n${{ steps.metrics.outputs.js_files }}" }
                  ]
                },
                {
                  "type": "divider"
                },
                {
                  "type": "context",
                  "elements": [
                    {
                      "type": "mrkdwn",
                      "text": "Reporte generado automaticamente por GitHub Actions | <${{ github.server_url }}/${{ github.repository }}|Ver Repositorio>"
                    }
                  ]
                }
              ]
            }
        env:
          SLACK_WEBHOOK_GENERAL: ${{ secrets.SLACK_WEBHOOK_GENERAL }}
