# ================================================================
#  WORKFLOW: Pruebas de Integración — EventosParaTi
#  
#  Ejecuta la suite de pruebas de integracion IT-01 a IT-05
#  contra una base de datos MySQL real en contenedor Docker,
#  validando conectividad, concurrencia y atomicidad.
#
#  Se activa en:
#   - Pull Requests hacia develop y main
#   - Push a develop y main
#   - Ejecucion manual (workflow_dispatch)
# ================================================================
name: Pruebas de Integración

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  integration-tests:
    name: "🧪 Suite de Integración IT-01 ~ IT-05"
    runs-on: ubuntu-latest

    # ── Servicio MySQL real en contenedor ──────────────────────
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: eventosparati
          MYSQL_USER: testuser
          MYSQL_PASSWORD: testpass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -u root -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      # ── 1. Obtener el código ───────────────────────────────
      - name: "📥 Checkout del código"
        uses: actions/checkout@v4

      # ── 2. Configurar PHP con extensiones MySQL ────────────
      - name: "🖥️ Configurar PHP 8.1 + mysqli"
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: mysqli, pdo, pdo_mysql, mbstring

      # ── 3. Esperar que MySQL esté completamente listo ──────
      - name: "⏳ Esperar inicialización de MySQL"
        run: |
          echo "Esperando que MySQL acepte conexiones..."
          for i in {1..20}; do
            if mysqladmin ping -h 127.0.0.1 -u root -proot --silent 2>/dev/null; then
              echo "✅ MySQL listo en intento $i"
              break
            fi
            echo "  Intento $i/20 — esperando 3s..."
            sleep 3
          done

      # ── 4. Inicializar el schema de la base de datos ───────
      - name: "🗄️ Inicializar Schema MySQL"
        run: |
          echo "══════════════════════════════════════════════════"
          echo "  Aplicando database/schema.sql a MySQL de prueba"
          echo "══════════════════════════════════════════════════"
          mysql -h 127.0.0.1 -u root -proot < database/schema.sql
          echo "✅ Schema aplicado correctamente"
          echo ""
          echo "  Tablas creadas:"
          mysql -h 127.0.0.1 -u root -proot eventosparati -e "SHOW TABLES;" 2>/dev/null

      # ── 5. Verificar conexión y tablas ────────────────────
      - name: "🔍 Verificar estructura de base de datos"
        run: |
          echo "══════════════════════════════════════════════════"
          echo "  Verificando tablas e integridad referencial"
          echo "══════════════════════════════════════════════════"
          mysql -h 127.0.0.1 -u root -proot eventosparati -e "
            SELECT 
              TABLE_NAME AS 'Tabla',
              TABLE_ROWS AS 'Filas',
              ENGINE AS 'Motor',
              TABLE_COLLATION AS 'Colacion'
            FROM information_schema.TABLES
            WHERE TABLE_SCHEMA = 'eventosparati';
          " 2>/dev/null
          echo "✅ Estructura verificada"

      # ── 6. Ejecutar Suite de Pruebas de Integración ───────
      - name: "🧪 Ejecutar IT-01 ~ IT-05: Suite de Integración"
        env:
          DB_HOST: 127.0.0.1
          DB_USER: root
          DB_PASS: root
          DB_NAME: eventosparati
          DB_PORT: 3306
        run: |
          echo "══════════════════════════════════════════════════"
          echo "  Lanzando suite de pruebas de integración"
          echo "══════════════════════════════════════════════════"
          php tests/integration/integration_tests.php

      # ── 7. Reporte de estado final de la BD ───────────────
      - name: "📊 Reporte de estado post-pruebas"
        if: always()
        run: |
          echo "══════════════════════════════════════════════════"
          echo "  Estado de tablas tras la ejecución de pruebas"
          echo "══════════════════════════════════════════════════"
          mysql -h 127.0.0.1 -u root -proot eventosparati -e "
            SELECT 'usuarios' AS tabla, COUNT(*) AS registros FROM usuarios
            UNION ALL
            SELECT 'tickets', COUNT(*) FROM tickets
            UNION ALL
            SELECT 'contactos', COUNT(*) FROM contactos;
          " 2>/dev/null || echo "BD no disponible para reporte"

      # ── 8. Notificar a Slack resultado de integración ─────
      - name: "📢 Notificar a Slack — Integración Exitosa"
        if: success() && env.SLACK_WEBHOOK_CI != ''
        uses: slackapi/slack-github-action@v2.0.0
        with:
          webhook: ${{ env.SLACK_WEBHOOK_CI }}
          webhook-type: incoming-webhook
          payload: |
            {
              "blocks": [
                {
                  "type": "header",
                  "text": {
                    "type": "plain_text",
                    "text": "🧪 Pruebas de Integración EXITOSAS - EventosParaTi",
                    "emoji": true
                  }
                },
                {
                  "type": "section",
                  "fields": [
                    { "type": "mrkdwn", "text": "*Pruebas:*\nIT-01 ~ IT-05 ✅" },
                    { "type": "mrkdwn", "text": "*Rama:*\n`${{ github.ref_name }}`" },
                    { "type": "mrkdwn", "text": "*BD:*\nMySQL 8.0 en contenedor ✅" },
                    { "type": "mrkdwn", "text": "*Autor:*\n${{ github.actor }}" }
                  ]
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "✅ Conectividad, concurrencia y atomicidad verificadas correctamente."
                  }
                },
                {
                  "type": "actions",
                  "elements": [
                    {
                      "type": "button",
                      "text": { "type": "plain_text", "text": "📋 Ver Logs" },
                      "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                    }
                  ]
                }
              ]
            }
        env:
          SLACK_WEBHOOK_CI: ${{ secrets.SLACK_WEBHOOK_CI }}

      - name: "🚨 Notificar a Slack — Integración Fallida"
        if: failure() && env.SLACK_WEBHOOK_CI != ''
        uses: slackapi/slack-github-action@v2.0.0
        with:
          webhook: ${{ env.SLACK_WEBHOOK_CI }}
          webhook-type: incoming-webhook
          payload: |
            {
              "blocks": [
                {
                  "type": "header",
                  "text": {
                    "type": "plain_text",
                    "text": "❌ Pruebas de Integración FALLIDAS - EventosParaTi",
                    "emoji": true
                  }
                },
                {
                  "type": "section",
                  "fields": [
                    { "type": "mrkdwn", "text": "*Rama:*\n`${{ github.ref_name }}`" },
                    { "type": "mrkdwn", "text": "*Autor:*\n${{ github.actor }}" }
                  ]
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "⚠️ Revisar los logs antes de continuar con el merge."
                  }
                },
                {
                  "type": "actions",
                  "elements": [
                    {
                      "type": "button",
                      "text": { "type": "plain_text", "text": "🔍 Ver Errores" },
                      "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
                      "style": "danger"
                    }
                  ]
                }
              ]
            }
        env:
          SLACK_WEBHOOK_CI: ${{ secrets.SLACK_WEBHOOK_CI }}
